<!DOCTYPE HTML>
<html lang="en">
<head>
  <title> </title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="python-programming.css">

  <style>
    :root{
      --white:#ffffff !important;
      --orange:#FCC979 !important;
      --text:#000000;
    }

    body{
      opacity:0;
      transition:opacity .45s ease;
      background:#ffffff;
      color:var(--text);
    }

    body.ready{ opacity:1; }

    #header .button{
      transition: transform .18s ease, box-shadow .18s ease;
      border-color: rgba(255, 255, 255, 0.5);
      color:white;
    }

    #header .button:hover{
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    #about.section-glow{ position:relative; overflow:hidden; }

    #about.section-glow::before,
    #about.section-glow::after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter: blur(90px);
      pointer-events:none;
    }

    #about.section-glow::before{
      width:420px;
      height:420px;
      top:-140px;
      right:-140px;
      background: radial-gradient(circle, rgba(255,122,0,.35), transparent 60%);
    }

    #about.section-glow::after{
      width:360px;
      height:360px;
      bottom:-160px;
      left:-160px;
      background: radial-gradient(circle, rgba(28,42,87,.45), transparent 60%);
    }

    h1.type {
      color: black;
      font-family: "Times New Roman Condensed", serif;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid var(--orange);
    }

    @keyframes caret { 50% { border-color: transparent; } }
    h1.type.caret { animation: caret 1s steps(1) infinite; }

    .reveal {
      opacity:0;
      transform: translateY(14px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .reveal.in { opacity:1; transform:none; }

    #main{ padding: 2.5rem 1.25rem; }
    #about{ max-width: 900px; margin: 0 auto; }

    #about p{
      line-height: 1.8;
      font-size: 1.05rem;
      margin: 1rem 0;
    }

    /* ===== PROJECTS ===== */
    #projects{
      padding: 60px 20px;
      display:flex;
      justify-content:center;
      flex-direction:column;
      align-items:center;
      gap:40px;
    }

    .project-card{
      background:#111827;
      padding:25px;
      border-radius:14px;
      max-width:750px;
      width:100%;
    }

    .buttons{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .buttons a{
      background:#FCC979;
      padding:10px 14px;
      border-radius:8px;
      text-decoration:none;
      color:#000;
      font-weight:600;
    }

    /* ===== SNAKE GAME ===== */
    #gameCanvas{
      background:#0b0f1a;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
    }

  </style>
</head>

<body>

  <header id="header">
    <div class="inner">
      <a href="portfolio.html" class="button">Back to projects</a>
    </div>
  </header>

  <main id="main">
    <section id="about" class="section-glow">

      <h1 class="type caret" id="typeTarget"></h1>

      <p class="reveal">
        Python is one of the most versatile languages in my toolkit...
      </p>

      <p class="reveal">
        I have developed projects that showcase Python’s flexibility...
      </p>

      <p class="reveal">
        What excites me most about Python is its ability to bridge different domains...
      </p>

    </section>
  </main>

  <section id="projects">

    <!-- SNAKE GAME (EMBEDDED) -->
    <div class="project-card game-wrapper">
      <h2>🐍 Snake Game (Playable)</h2>
      <p>Play the game directly in the browser.</p>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <button id="startBtn">Start Game</button>
</div>

  </section>

  <script>
    window.addEventListener('load', ()=> document.body.classList.add('ready'));

    // Typewriter
    (function(){
      const text = "Python programming";
      const el = document.getElementById('typeTarget');
      let i = 0;

      function type(){
        el.textContent = text.slice(0, ++i);
        if(i < text.length) setTimeout(type, 60);
        else el.classList.add('caret');
      }
      type();
    })();

    // Reveal
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    });

    document.querySelectorAll('.reveal').forEach(el=> io.observe(el));

    // ===== SNAKE GAME =====
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const grid = 20;
    let snake = [{x:160,y:160}];
    let dx = grid;
    let dy = 0;

    let food = randomFood();
    let counter = 0;

    function randomFood(){
      return {
        x: Math.floor(Math.random()*20)*grid,
        y: Math.floor(Math.random()*20)*grid
      };
    }

    function loop(){
      requestAnimationFrame(loop);

      if(++counter < 6) return;
      counter = 0;

      ctx.clearRect(0,0,canvas.width,canvas.height);

      let head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      if(head.x === food.x && head.y === food.y){
        food = randomFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle="orange";
      ctx.fillRect(food.x, food.y, grid-2, grid-2);

      ctx.fillStyle="#00ff88";
      snake.forEach(p=>{
        ctx.fillRect(p.x,p.y,grid-2,grid-2);
      });

      if(head.x < 0 || head.y < 0 || head.x >= 400 || head.y >= 400){
        snake = [{x:160,y:160}];
      }
    }

    document.addEventListener("keydown", e=>{
      if(e.key==="ArrowUp" && dy===0){ dx=0; dy=-grid; }
      if(e.key==="ArrowDown" && dy===0){ dx=0; dy=grid; }
      if(e.key==="ArrowLeft" && dx===0){ dx=-grid; dy=0; }
      if(e.key==="ArrowRight" && dx===0){ dx=grid; dy=0; }
    });

    loop();
  </script>

</body>
</html>
